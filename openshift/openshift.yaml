apiVersion: v1
kind: ConfigMap
metadata:
  name: springboot-openshift-2-config
  labels:
    app: springboot-openshift-2
data:
  APP_MESSAGE: "Hello World depuis Spring Boot sur OpenShift !"

---
apiVersion: image.openshift.io/v1
kind: ImageStream
metadata:
  name: springboot-openshift-2
  labels:
    app: springboot-openshift-2
spec: {}

---
apiVersion: build.openshift.io/v1
kind: BuildConfig
metadata:
  name: springboot-openshift-2
  labels:
    app: springboot-openshift-2
spec:
  source:
    type: Git
    git:
      uri: https://github.com/nicolas-budin/spring_boot_openshift
      ref: main
  strategy:
    type: Docker
    dockerStrategy:
      dockerfilePath: Dockerfile
  output:
    to:
      kind: ImageStreamTag
      name: springboot-openshift-2:latest

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: springboot-openshift-2
  labels:
    app: springboot-openshift-2
spec:
  replicas: 1
  selector:
    matchLabels:
      app: springboot-openshift-2
  template:
    metadata:
      labels:
        app: springboot-openshift-2
    spec:
      containers:
        - name: springboot-openshift-2
          image: image-registry.openshift-image-registry.svc:5000/CHANGE_ME_NAMESPACE/springboot-openshift-2:latest
          ports:
            - containerPort: 8080
          env:
            - name: APP_MESSAGE
              valueFrom:
                configMapKeyRef:
                  name: springboot-openshift-2-config
                  key: APP_MESSAGE
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 15
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"

---
apiVersion: v1
kind: Service
metadata:
  name: springboot-openshift-2
  labels:
    app: springboot-openshift-2
spec:
  selector:
    app: springboot-openshift-2
  ports:
    - name: http
      port: 8080
      targetPort: 8080

---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: springboot-openshift-2
  labels:
    app: springboot-openshift-2
spec:
  to:
    kind: Service
    name: springboot-openshift-2
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
